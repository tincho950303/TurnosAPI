services:
  - type: web
    name: turnosapi
    runtime: python
    healthCheckPath: /health
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 2 -b 0.0.0.0:$PORT wsgi:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      # Sin DATABASE_URL a propósito: SQLite + SEED_DEMO=true mantiene
      # la demo viva sin depender del Postgres gratuito (expira).
